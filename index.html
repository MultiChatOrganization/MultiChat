            </div>

    <!-- SETTINGS MODAL -->

            </div>
            
            <!-- Modal Body -->

                <!-- Theme Select -->

        /**
         * State Management
         */
        let state = {
            currentLang: localStorage.getItem('mc_lang') || 'ru',
            theme: localStorage.getItem('mc_theme') || 'dark',
            chats: JSON.parse(localStorage.getItem('mc_chats') || '[]'),
            currentChatId: null,
            attachment: null // Holds attached image (base64) or text content
        };

        // DOM Elements References
        const sidebar = document.getElementById('sidebar');
        const toggleSidebarBtn = document.getElementById('toggle-sidebar-btn');
        const expandSidebarBtn = document.getElementById('expand-sidebar-btn');
        const sidebarIcon = document.getElementById('sidebar-icon');
        const newChatBtn = document.getElementById('new-chat-btn');
        const chatList = document.getElementById('chat-list');
        const openSettingsBtn = document.getElementById('open-settings-btn');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const saveSettingsBtn = document.getElementById('save-settings-btn');
        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        const themeBtnText = document.getElementById('theme-btn-text');
        const themeBtnIcon = document.getElementById('theme-btn-icon');
        const langSelect = document.getElementById('lang-select');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const attachBtn = document.getElementById('attach-btn');
        const fileInput = document.getElementById('file-input');
        const attachmentPreview = document.getElementById('attachment-preview');
        const attachmentName = document.getElementById('attachment-name');
        const attachmentIcon = document.getElementById('attachment-icon');
        const removeAttachmentBtn = document.getElementById('remove-attachment-btn');
        const welcomeView = document.getElementById('welcome-view');
        const messagesList = document.getElementById('messages-list');
        const messagesContainer = document.getElementById('messages-container');
        const currentChatTitle = document.getElementById('current-chat-title');

        /**
         * Initialize App
         */
        window.addEventListener('DOMContentLoaded', () => {
            applyTheme(state.theme);
            applyLanguage(state.currentLang);
            langSelect.value = state.currentLang;
            renderChatList();

            // Load last active chat or start new
            if (state.chats.length > 0) {
                loadChat(state.chats[0].id);
            } else {
                createNewChat();
            }
        });

        /**
         * Theme Handling
         */
        function applyTheme(theme) {
            state.theme = theme;
            localStorage.setItem('mc_theme', theme);
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
                themeBtnIcon.className = 'fa-solid fa-moon';
                themeBtnText.textContent = translations[state.currentLang].darkTheme;
            } else {
                document.documentElement.classList.remove('dark');
                themeBtnIcon.className = 'fa-solid fa-sun';
                themeBtnText.textContent = translations[state.currentLang].lightTheme;
            }
        }

        themeToggleBtn.addEventListener('click', () => {
            applyTheme(state.theme === 'dark' ? 'light' : 'dark');
        });

        /**
         * Language Handling (i18n)
         */
        function applyLanguage(lang) {
            state.currentLang = lang;
            localStorage.setItem('mc_lang', lang);
            const t = translations[lang] || translations.ru;

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key]) el.placeholder = t[key];
            });

            themeBtnText.textContent = state.theme === 'dark' ? t.darkTheme : t.lightTheme;
            renderChatList();
        }

        /**
         * Sidebar Collapsing Functionality
         */
        let isSidebarCollapsed = false;

        function toggleSidebar() {
            isSidebarCollapsed = !isSidebarCollapsed;
            if (isSidebarCollapsed) {
                sidebar.classList.add('sidebar-collapsed');
                expandSidebarBtn.classList.remove('hidden');
            } else {
                sidebar.classList.remove('sidebar-collapsed');
                expandSidebarBtn.classList.add('hidden');
            }
        }

        toggleSidebarBtn.addEventListener('click', toggleSidebar);
        expandSidebarBtn.addEventListener('click', toggleSidebar);

        /**
         * Settings Modal Actions
         */
        openSettingsBtn.addEventListener('click', () => settingsModal.classList.remove('hidden'));
        closeSettingsBtn.addEventListener('click', () => settingsModal.classList.add('hidden'));
        saveSettingsBtn.addEventListener('click', () => {
            applyLanguage(langSelect.value);
            settingsModal.classList.add('hidden');
        });

        /**
         * Chat Data Management & LocalStorage
         */
        function saveChatsToStorage() {
            localStorage.setItem('mc_chats', JSON.stringify(state.chats));
        }

        function createNewChat() {
            const newChat = {
                id: 'chat_' + Date.now(),
                title: translations[state.currentLang].newChat,
                date: new Date().toLocaleDateString(state.currentLang, { month: 'short', day: 'numeric' }),
                messages: []
            };
            state.chats.unshift(newChat);
            saveChatsToStorage();
            renderChatList();
            loadChat(newChat.id);
        }

        newChatBtn.addEventListener('click', createNewChat);

        function renderChatList() {
            chatList.innerHTML = '';
            state.chats.forEach(chat => {
                const isActive = chat.id === state.currentChatId;
                const item = document.createElement('div');
                item.className = `group relative flex items-center justify-between p-3 rounded-xl cursor-pointer transition-all ${
                    isActive 
                    ? 'bg-slate-200/80 dark:bg-navy-800 text-slate-900 dark:text-white font-semibold' 
                    : 'hover:bg-slate-200/40 dark:hover:bg-navy-800/50 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200'
                }`;

                item.innerHTML = `
                    <div class="flex items-center space-x-3 truncate">
                        <i class="fa-regular fa-message text-sm"></i>
                        <span class="truncate text-sm">${escapeHTML(chat.title)}</span>
                    </div>
                    <div class="flex items-center space-x-1">
                        <span class="text-[10px] opacity-60 font-normal group-hover:hidden">${chat.date}</span>
                        <button class="delete-chat-btn hidden group-hover:block text-slate-400 hover:text-red-500 p-1" data-id="${chat.id}">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                `;

                item.addEventListener('click', (e) => {
                    if (e.target.closest('.delete-chat-btn')) return;
                    loadChat(chat.id);
                    // On mobile screens, automatically collapse sidebar on selecting chat
                    if (window.innerWidth < 768 && !isSidebarCollapsed) {
                        toggleSidebar();
                    }
                });

                chatList.appendChild(item);
            });

            // Bind Delete Listeners
            document.querySelectorAll('.delete-chat-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.getAttribute('data-id');
                    deleteChat(id);
                });
            });
        }

        function deleteChat(id) {
            state.chats = state.chats.filter(c => c.id !== id);
            saveChatsToStorage();
            if (state.currentChatId === id) {
                if (state.chats.length > 0) {
                    loadChat(state.chats[0].id);
                } else {
                    createNewChat();
                }
            } else {
                renderChatList();
            }
        }

        function loadChat(id) {
            state.currentChatId = id;
            renderChatList();
            const activeChat = state.chats.find(c => c.id === id);
            if (!activeChat) return;

            currentChatTitle.textContent = activeChat.title;
            messagesList.innerHTML = '';

            const inputHeroWrapper = document.getElementById('input-hero-wrapper');
            const messagesContainer = document.getElementById('messages-container');

            if (activeChat.messages.length === 0) {
                welcomeView.classList.remove('hidden');
                messagesContainer.classList.add('hidden');
                inputHeroWrapper.classList.add('flex-1', 'justify-center');
                inputHeroWrapper.classList.remove('pb-6', 'w-full');
            } else {
                welcomeView.classList.add('hidden');
                messagesContainer.classList.remove('hidden');
                inputHeroWrapper.classList.remove('flex-1', 'justify-center');
                inputHeroWrapper.classList.add('pb-4', 'pt-2');
                activeChat.messages.forEach(msg => appendMessageUI(msg.role, msg.content, msg.attachment));
                scrollToBottom();
            }
        }

        /**
         * File & Attachment Handling
         */
        attachBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();

            if (file.type.startsWith('image/')) {
                reader.onload = (ev) => {
                    state.attachment = {
                        type: 'image',
                        name: file.name,
                        data: ev.target.result
                    };
                    showAttachmentPreview(file.name, 'fa-image');
                };
                reader.readAsDataURL(file);
            } else {
                reader.onload = (ev) => {
                    state.attachment = {
                        type: 'text',
                        name: file.name,
                        data: ev.target.result
                    };
                    showAttachmentPreview(file.name, 'fa-file-lines');
                };
                reader.readAsText(file);
            }
        });

        function showAttachmentPreview(name, iconClass) {
            attachmentName.textContent = name;
            attachmentIcon.className = `fa-solid ${iconClass} text-indigo-500`;
            attachmentPreview.classList.remove('hidden');
        }

        removeAttachmentBtn.addEventListener('click', () => {
            state.attachment = null;
            fileInput.value = '';
            attachmentPreview.classList.add('hidden');
        });

        /**
         * Textarea Auto-Resize & Input Validation
         */
        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = userInput.scrollHeight + 'px';
            sendBtn.disabled = !userInput.value.trim() && !state.attachment;
        });

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!sendBtn.disabled) chatForm.dispatchEvent(new Event('submit'));
            }
        });

        /**
         * Message UI Rendering & Dynamic Markdown
         */
        function appendMessageUI(role, text, attachment = null) {
            const inputHeroWrapper = document.getElementById('input-hero-wrapper');
            const messagesContainer = document.getElementById('messages-container');
            
            welcomeView.classList.add('hidden');
            messagesContainer.classList.remove('hidden');
            inputHeroWrapper.classList.remove('flex-1', 'justify-center');
            inputHeroWrapper.classList.add('pb-4', 'pt-2');

            const isUser = role === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex gap-3 w-full ${isUser ? 'justify-end' : 'justify-start'}`;

            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            let attachmentHTML = '';
            if (attachment) {
                if (attachment.type === 'image') {
                    attachmentHTML = `<div class="mb-2"><img src="${attachment.data}" alt="attachment" class="max-w-xs max-h-48 rounded-lg shadow-sm border border-slate-200 dark:border-white/10"/></div>`;
                } else if (attachment.type === 'text') {
                    attachmentHTML = `<div class="mb-2 p-2 bg-black/10 dark:bg-white/10 rounded text-xs font-mono truncate max-w-xs">📎 ${escapeHTML(attachment.name)}</div>`;
                }
            }

            const parsedText = isUser ? escapeHTML(text) : marked.parse(text);

            wrapper.innerHTML = `
                ${!isUser ? `
                    <div class="w-7 h-7 rounded-lg bg-slate-900 dark:bg-white text-white dark:text-navy-950 flex items-center justify-center text-xs font-bold shrink-0 mt-0.5">
                        <i class="fa-solid fa-brain"></i>
                    </div>
                ` : ''}
                <div class="flex flex-col max-w-[90%] ${isUser ? 'items-end' : 'items-start'}">
                    <div class="px-4 py-2.5 rounded-2xl text-sm ${
                        isUser 
                        ? 'bg-slate-900 dark:bg-white text-white dark:text-navy-950 rounded-br-xs' 
                        : 'bg-slate-100 dark:bg-navy-900 text-slate-800 dark:text-slate-100 border border-slate-200/60 dark:border-white/5 rounded-tl-xs prose dark:prose-invert max-w-none'
                    }">
                        ${attachmentHTML}
                        <div class="message-content">${parsedText}</div>
                    </div>
                    <span class="text-[10px] text-slate-400 mt-1 px-1">${timeStr}</span>
                </div>
            `;

            messagesList.appendChild(wrapper);
            scrollToBottom();
            return wrapper;
        }

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        /**
         * OpenRouter API Communication with Memory Context
         */
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            const currentAttachment = state.attachment;

            if (!text && !currentAttachment) return;

            // Reset input form
            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.disabled = true;
            state.attachment = null;
            attachmentPreview.classList.add('hidden');

            const activeChat = state.chats.find(c => c.id === state.currentChatId);
            if (!activeChat) return;

            // Update title if first message
            if (activeChat.messages.length === 0 && text) {
                activeChat.title = text.slice(0, 24) + (text.length > 24 ? '...' : '');
                currentChatTitle.textContent = activeChat.title;
                renderChatList();
            }

            // Push User Message to State & UI
            const userMsgObj = { role: 'user', content: text, attachment: currentAttachment };
            activeChat.messages.push(userMsgObj);
            saveChatsToStorage();
            appendMessageUI('user', text, currentAttachment);

            // Append Typing Indicator Placeholder
            const typingWrapper = appendMessageUI('assistant', '<i class="fa-solid fa-ellipsis animate-pulse"></i>');

            // Format API Payload with past message context memory
            const apiMessages = activeChat.messages.map(m => {
                let content = m.content;
                if (m.attachment && m.attachment.type === 'text') {
                    content += `\n\n[Attached File Content (${m.attachment.name})]:\n${m.attachment.data}`;
                }
                
                // OpenRouter standard vision/text structure if image
                if (m.attachment && m.attachment.type === 'image') {
                    return {
                        role: m.role,
                        content: [
                            { type: "text", text: content },
                            { type: "image_url", image_url: { url: m.attachment.data } }
                        ]
                    };
                }

                return { role: m.role, content: content };
            });

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
                        "HTTP-Referer": window.location.origin,
                        "X-Title": "MultiChat",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: MODEL_NAME,
                        messages: apiMessages
                    })
                });

                const data = await response.json();
                
                if (response.ok && data.choices && data.choices.length > 0) {
                    const aiReply = data.choices[0].message.content;
                    
                    // Save Assistant Response to state
                    activeChat.messages.push({ role: 'assistant', content: aiReply });
                    saveChatsToStorage();

                    // Update UI placeholder text with formatted response
                    typingWrapper.querySelector('.message-content').innerHTML = marked.parse(aiReply);
                } else {
                    const apiErrDetail = data.error?.message || data.message || `HTTP ${response.status}: ${response.statusText}`;
                    throw new Error(apiErrDetail);
                }
            } catch (err) {
                console.error("API Error:", err);
                const errText = translations[state.currentLang].errorMsg;
                const errHTML = `
                    <div class="p-3 bg-red-500/10 border border-red-500/20 rounded-xl text-red-500 text-xs font-sans space-y-1">
                        <div class="flex items-center space-x-2 font-semibold">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                            <span>${escapeHTML(errText)}</span>
                        </div>
                        <div class="font-mono text-[11px] opacity-90">${escapeHTML(err.message)}</div>
                    </div>
                `;
                typingWrapper.querySelector('.message-content').innerHTML = errHTML;
                
                // Save error state in active chat history as system error
                activeChat.messages.push({ role: 'assistant', content: `⚠️ Error: ${err.message}` });
                saveChatsToStorage();
            }

            scrollToBottom();
        });
    </script>
</body>
</html>
